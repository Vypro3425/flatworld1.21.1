# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Neo version to get properly mapped mod sources and correct dependencies.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get properly mapped mod sources and correct dependencies.
neo_version=21.1.209
# The Neo version range can use any version of Neo as bounds or match the loader version range.
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=flatworld
# The human-readable display name for the mod.
mod_name=Flat World Portal
# The license of the mod.
mod_license=All Rights Reserved
# The mod version.
mod_version=1.0.0
# The group ID for the mod.
mod_group_id=com.flatworld.mod
# The authors of the mod.
mod_authors=You
# The description of the mod.
mod_description=Adds a Compressed Stone portal that leads to a peaceful superflat pocket dimension.
